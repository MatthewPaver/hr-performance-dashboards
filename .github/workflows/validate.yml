name: Validate analytics handoff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hr-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Check the public handoff package
        run: node scripts/validate-package.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test synthetic sample schema and semantic transformations
        run: python -m unittest discover -s tests -v
      - name: Reproduce pinned public data and check committed output
        run: |
          python scripts/rebuild_public_data.py --as-of 2014-06-30
          git diff --exit-code -- docs/rebuilt
